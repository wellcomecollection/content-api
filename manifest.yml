# Backplane (backplane/v1) description of this repository, gathered into
# https://github.com/wellcomecollection/catalog, which names the owning team
# for this repository wherever it appears (for example in the security digests).
apiVersion: backplane/v1
kind: System
metadata:
  name: content-api
  description: The Content API, serving non-catalogue content such as articles, events and exhibitions
  annotations:
    github.com/project-slug: wellcomecollection/content-api
  links:
    - title: Runbook
      url: https://github.com/wellcomecollection/content-api/blob/main/docs/runbook.md
spec:
  owner: team:digital-experience
---
apiVersion: backplane/v1
kind: Resource
metadata:
  name: prismic
  description: Prismic repository wellcomecollection, the source of editorial content
spec:
  type: external
  owner: team:digital-experience
  system: system:content-api
---
apiVersion: backplane/v1
kind: Resource
metadata:
  name: content-elasticsearch
  description: Elastic Cloud cluster for the content API, a dated deployment (content-2026-10-13)
spec:
  type: search-index
  owner: team:digital-experience
  system: system:content-api
