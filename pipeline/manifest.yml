apiVersion: backplane/v1
kind: Component
metadata:
  name: content-pipeline
  title: Content pipeline
  description: Scheduled Lambda that indexes updated Prismic content into the content Elasticsearch cluster
spec:
  type: pipeline
  owner: team:digital-experience
  lifecycle: production
  system: system:content-api
  dependsOn:
    - ref: component:catalogue-api-search
      criticality: soft
      description: Enriches addressables with works; failures are dropped
    - resource:prismic
    - ref: resource:content-elasticsearch
      description: Writes the indexes
    - ref: resource:api-wellcomecollection-org-cloudfront
      criticality: soft
