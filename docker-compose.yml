services:
  tooling:
    build:
      dockerfile: tooling.Dockerfile
      context: .

  api:
    build:
      dockerfile: ./api/Dockerfile
      context: .
      target: runtime

  api-test:
    build:
      dockerfile: ./api/Dockerfile
      context: .
      target: test

  pipeline:
    build:
      dockerfile: ./pipeline/Dockerfile
      context: .

  webhook:
    build:
      dockerfile: ./webhook/Dockerfile
      context: .

  unpublisher:
    build:
      dockerfile: ./unpublisher/Dockerfile
      context: .
